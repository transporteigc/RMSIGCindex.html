<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RMS · Capacitación — Transporte IGC S.A.S.</title>
<meta name="description" content="Capacitación interactiva sobre el Régimen de Medidas Simplificadas (RMS) para el personal de Transporte IGC S.A.S.">
<style>
/* ============================================================
   IGC · RMS — Sistema de diseño "Ruta RMS"
   Tokens derivados del logo de Transporte IGC
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --navy-deep:#051a2c;
  --navy:#0b2942;
  --navy-light:#123a5e;
  --navy-lighter:#1e4f7a;
  --gold:#e0a526;
  --gold-light:#f2c463;
  --gold-dim:#c98f1c;
  --paper:#f7f3ea;
  --paper-dim:#efe8d6;
  --ink:#0b2942;
  --white:#ffffff;
  --green:#2e9e5b;
  --green-dim:#e4f4ea;
  --yellow:#e8a93b;
  --yellow-dim:#fdf1dc;
  --red:#d4483b;
  --red-dim:#fbe7e4;
  --font-display:'Poppins', sans-serif;
  --font-body:'Inter', sans-serif;
  --radius:18px;
  --radius-sm:10px;
  --shadow-card:0 12px 30px -12px rgba(5,26,44,.35);
  --shadow-soft:0 6px 18px -8px rgba(5,26,44,.25);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--navy-deep);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
.hidden{display:none !important;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

/* ---------- App shell ---------- */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  max-width:640px;
  margin:0 auto;
  background:var(--paper);
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.4);
}
@media (min-width:641px){
  body{background:linear-gradient(180deg,var(--navy-deep),var(--navy) 40%,#0d3352);}
  #app{min-height:100vh;}
}

/* ---------- Ruta RMS (progress) ---------- */
.ruta-wrap{
  background:var(--navy);
  padding:14px 16px 18px;
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid rgba(224,165,38,.25);
}
.ruta-brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.ruta-brand img{height:22px; width:auto;}
.ruta-brand span{
  color:var(--gold-light);
  font-family:var(--font-display);
  font-weight:700;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.ruta{
  position:relative;
  height:40px;
}
.ruta-line{
  position:absolute;
  top:14px; left:14px; right:14px;
  height:3px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 8px, transparent 8px 16px);
  border-radius:3px;
}
.ruta-line-fill{
  position:absolute;
  top:14px; left:14px;
  height:3px;
  background:var(--gold);
  border-radius:3px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.ruta-nodes{
  position:absolute; top:0; left:0; right:0;
  display:flex; justify-content:space-between;
  padding:0 8px;
}
.ruta-node{
  width:28px; height:28px; border-radius:50%;
  background:var(--navy-light);
  border:2px solid rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:rgba(255,255,255,.55);
  transition:all .35s ease;
  position:relative;
}
.ruta-node.done{background:var(--gold); border-color:var(--gold); color:var(--navy);}
.ruta-node.active{background:var(--navy); border-color:var(--gold); color:var(--gold-light); box-shadow:0 0 0 4px rgba(224,165,38,.25);}
.ruta-truck{
  position:absolute;
  top:-11px;
  font-size:20px;
  transition:left .5s cubic-bezier(.4,0,.2,1);
  transform:translateX(-50%);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
}

/* ---------- Screens ---------- */
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:22px 18px 100px;
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.eyebrow{
  color:var(--gold-dim);
  font-weight:800;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.screen h2{font-size:24px; color:var(--navy); margin-bottom:10px;}
.screen-sub{color:#5c6b78; font-size:14.5px; margin-bottom:20px;}

/* ---------- Cover ---------- */
.cover{
  background:radial-gradient(120% 100% at 50% 0%, #0f3a5c 0%, var(--navy) 55%, var(--navy-deep) 100%);
  color:var(--white);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.cover-road{
  position:absolute; bottom:0; left:0; right:0; height:120px;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.35));
}
.cover-lane{
  position:absolute; bottom:38px; left:-10%; width:120%; height:4px;
  background:repeating-linear-gradient(90deg, var(--gold) 0 26px, transparent 26px 54px);
  opacity:.55;
  animation:drive 2.4s linear infinite;
}
@keyframes drive{ from{transform:translateX(0);} to{transform:translateX(54px);} }
.cover img.logo{height:56px; width:auto; margin-bottom:28px;}
.cover .kicker{
  color:var(--gold-light);
  font-weight:800;
  font-size:13px;
  letter-spacing:.16em;
  text-transform:uppercase;
  margin-bottom:14px;
}
.cover h1{
  font-size:clamp(28px,7vw,38px);
  line-height:1.15;
  margin-bottom:14px;
  max-width:420px;
}
.cover h1 em{color:var(--gold); font-style:normal;}
.cover p.desc{
  color:rgba(255,255,255,.75);
  font-size:15px;
  max-width:360px;
  margin-bottom:26px;
}
.cover-meta{
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  margin-bottom:32px;
}
.pill{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  color:var(--white);
  padding:8px 14px;
  border-radius:99px;
  font-size:12.5px;
  font-weight:600;
  display:flex; align-items:center; gap:6px;
}
.pill b{color:var(--gold-light);}

/* ---------- Buttons ---------- */
.btn{
  border:none;
  border-radius:14px;
  padding:16px 22px;
  font-weight:800;
  font-size:15.5px;
  font-family:var(--font-display);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  width:100%;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg, var(--gold-light), var(--gold));
  color:var(--navy-deep);
  box-shadow:0 10px 24px -8px rgba(224,165,38,.55);
}
.btn-primary:hover{box-shadow:0 14px 30px -8px rgba(224,165,38,.7);}
.btn-ghost{
  background:rgba(255,255,255,.08);
  color:var(--white);
  border:1px solid rgba(255,255,255,.28);
}
.btn-outline{
  background:transparent;
  color:var(--navy);
  border:2px solid var(--navy);
}
.btn-dark{
  background:var(--navy);
  color:var(--white);
}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; margin-top:10px;}
.btn-row .btn{width:auto; flex:1;}

/* ---------- Cards ---------- */
.card{
  background:var(--white);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow-soft);
  border:1px solid rgba(11,41,66,.06);
}
.card + .card{margin-top:14px;}

.learn-stage{
  min-height:340px;
  display:flex;
  flex-direction:column;
}
.learn-card{
  background:var(--white);
  border-radius:20px;
  padding:26px 22px;
  box-shadow:var(--shadow-card);
  flex:1;
  display:flex;
  flex-direction:column;
  border-top:6px solid var(--gold);
}
.learn-card .icon{font-size:34px; margin-bottom:12px;}
.learn-card h3{font-size:20px; color:var(--navy); margin-bottom:10px;}
.learn-card p{color:#3d4a56; font-size:15px; line-height:1.6;}
.learn-card .flow{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin:14px 0 6px;
}
.flow-step{
  background:var(--navy);
  color:var(--gold-light);
  font-weight:800;
  font-size:12.5px;
  padding:8px 12px;
  border-radius:99px;
}
.flow-arrow{color:var(--gold-dim); font-weight:800;}

.grid-icons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:6px;
}
.grid-icons .g-item{
  background:var(--paper-dim);
  border-radius:12px;
  padding:12px 6px;
  text-align:center;
  font-size:12.5px;
  font-weight:700;
  color:var(--navy);
}
.grid-icons .g-item span{display:block; font-size:22px; margin-bottom:4px;}

.dont-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.dont-list li{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--red-dim);
  border-radius:12px;
  padding:10px 12px;
  font-size:14px;
  color:#6b2a24;
  font-weight:600;
}
.dont-list li::before{content:"✕"; color:var(--red); font-weight:900; flex-shrink:0;}

.learn-dots{
  display:flex; justify-content:center; gap:6px; margin:16px 0 4px;
}
.learn-dots span{width:7px; height:7px; border-radius:50%; background:rgba(11,41,66,.18);}
.learn-dots span.active{background:var(--gold); width:20px; border-radius:5px;}

/* ---------- Detect scenarios ---------- */
.case-counter{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.case-counter .tag{
  background:var(--navy); color:var(--gold-light);
  font-weight:800; font-size:12px; padding:6px 12px; border-radius:99px;
}
.score-badge{
  background:var(--paper-dim); color:var(--navy);
  font-weight:800; font-size:12px; padding:6px 12px; border-radius:99px;
}
.case-card{
  background:var(--navy);
  color:var(--white);
  border-radius:20px;
  padding:24px 20px;
  box-shadow:var(--shadow-card);
  position:relative;
  overflow:hidden;
}
.case-card::before{
  content:"🚨";
  position:absolute; top:-10px; right:-6px; font-size:80px; opacity:.08;
}
.case-card .situation{
  font-size:17px; font-weight:600; line-height:1.5; margin-bottom:18px;
  position:relative;
}
.case-options{display:flex; flex-direction:column; gap:10px;}
.opt-btn{
  text-align:left;
  border-radius:14px;
  padding:14px 16px;
  font-weight:700;
  font-size:14.5px;
  border:2px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:var(--white);
  display:flex; gap:10px; align-items:center;
}
.opt-btn:active{transform:scale(.98);}
.opt-btn.correct{background:var(--green); border-color:var(--green); color:var(--white);}
.opt-btn.incorrect{background:var(--red); border-color:var(--red); color:var(--white);}
.opt-btn.dim{opacity:.45;}
.opt-btn[disabled]{cursor:default;}

.feedback-box{
  margin-top:16px;
  border-radius:14px;
  padding:16px;
  font-size:14px;
  line-height:1.55;
  animation:fadeUp .3s ease;
}
.feedback-box.ok{background:var(--green-dim); color:#1c5c39; border:1px solid #bfe4cd;}
.feedback-box.bad{background:var(--red-dim); color:#7a2a22; border:1px solid #f0c2bc;}
.feedback-box .fb-title{font-weight:800; margin-bottom:4px; font-size:14.5px;}

/* ---------- Mini game ---------- */
.game-card{
  background:var(--white);
  border-radius:20px;
  padding:24px 20px;
  box-shadow:var(--shadow-card);
  text-align:center;
}
.game-card .situation{font-size:16.5px; font-weight:700; color:var(--navy); margin-bottom:18px; line-height:1.5;}
.game-options{display:flex; gap:8px;}
.game-opt{
  flex:1;
  border-radius:14px;
  padding:16px 6px;
  font-weight:800;
  font-size:13.5px;
  border:2px solid transparent;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.game-opt .emoji{font-size:22px;}
.game-opt.normal{background:var(--green-dim); color:#1c5c39;}
.game-opt.alerta{background:var(--yellow-dim); color:#7a5a12;}
.game-opt.informar{background:var(--red-dim); color:#7a2a22;}
.game-opt.chosen-correct{outline:3px solid var(--green); box-shadow:0 0 0 3px var(--green) inset;}
.game-opt.chosen-wrong{outline:3px solid var(--red); box-shadow:0 0 0 3px var(--red) inset;}

.result-hero{
  text-align:center;
  padding:30px 20px;
  border-radius:22px;
  color:var(--white);
  margin-bottom:18px;
}
.result-hero.pass{background:linear-gradient(135deg,#1c7a45,#2e9e5b);}
.result-hero.fail{background:linear-gradient(135deg,#a83a2f,#d4483b);}
.result-hero .score-num{font-family:var(--font-display); font-size:52px; font-weight:800; line-height:1;}
.result-hero .score-pct{font-size:16px; font-weight:700; opacity:.9; margin-top:4px;}
.result-hero .status{
  display:inline-block; margin-top:14px;
  background:rgba(255,255,255,.18);
  padding:8px 18px; border-radius:99px; font-weight:800; font-size:13px; letter-spacing:.06em;
}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-weight:700; font-size:13px; color:var(--navy); margin-bottom:6px;}
.field input, .field select{
  width:100%;
  padding:14px 14px;
  border-radius:12px;
  border:2px solid #dfe3e7;
  font-size:15px;
  font-family:inherit;
  background:var(--white);
  color:var(--ink);
}
.field input:focus, .field select:focus{border-color:var(--gold); outline:none;}
.field .hint{font-size:12px; color:#8a97a3; margin-top:4px;}

.quiz-q{
  background:var(--white);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow-soft);
}
.quiz-q h3{font-size:16.5px; color:var(--navy); margin-bottom:14px; line-height:1.45;}
.quiz-opt{
  display:flex; align-items:center; gap:10px;
  padding:13px 14px;
  border-radius:12px;
  border:2px solid #e4e8ec;
  margin-bottom:8px;
  font-size:14.5px;
  font-weight:600;
  color:var(--navy);
}
.quiz-opt .letter{
  width:24px; height:24px; border-radius:50%;
  background:var(--paper-dim); color:var(--navy);
  font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.quiz-opt.selected{border-color:var(--gold); background:var(--yellow-dim);}
.quiz-opt.selected .letter{background:var(--gold); color:var(--navy-deep);}

/* ---------- Sticky footer ---------- */
.screen-footer{
  position:sticky; bottom:0; left:0; right:0;
  background:linear-gradient(0deg, var(--paper) 60%, rgba(247,243,234,0));
  padding:18px 18px 20px;
  margin:0 -18px -100px;
}
.cover .screen-footer{background:none;}

/* ---------- Document / certificado ---------- */
.doc-page{
  background:var(--white);
  border-radius:16px;
  padding:26px 22px;
  box-shadow:var(--shadow-soft);
  margin-bottom:16px;
  border:1px solid #e6e1d3;
}
.doc-page h3{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-dim); font-weight:800; margin-bottom:14px;}
.doc-badge{
  background:var(--navy); border-radius:10px; padding:10px 12px; display:inline-block; margin-bottom:16px;
}
.doc-badge img{height:24px;}
.doc-title{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy); margin-bottom:6px;}
.doc-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #e2ded0; font-size:13.5px;}
.doc-row span:first-child{color:#7c8792; font-weight:600;}
.doc-row span:last-child{color:var(--navy); font-weight:700; text-align:right;}
.doc-statement{font-size:13.5px; color:#3d4a56; line-height:1.7; margin:14px 0; font-style:italic;}
.doc-signrow{display:flex; gap:16px; margin-top:26px;}
.doc-signbox{flex:1; border-top:2px solid var(--navy); padding-top:8px; font-size:11.5px; color:#7c8792; text-align:center;}
.doc-check{display:flex; gap:10px; align-items:flex-start; background:var(--paper-dim); border-radius:12px; padding:12px; margin-top:14px; font-size:12.5px; color:#3d4a56;}
.qa-item{border-radius:12px; padding:12px; background:var(--paper-dim); margin-bottom:8px;}
.qa-item .qa-q{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:6px;}
.qa-item .qa-a{font-size:12.5px; color:#3d4a56;}
.qa-item .qa-status{font-weight:800; font-size:11.5px; margin-top:4px;}
.qa-item.ok .qa-status{color:var(--green);}
.qa-item.bad .qa-status{color:var(--red);}
.rec-box{background:var(--yellow-dim); border-radius:14px; padding:16px; font-size:13.5px; color:#5a4413; line-height:1.6; margin-bottom:10px;}
.doc-code{font-family:var(--font-display); font-weight:800; letter-spacing:.06em; color:var(--gold-dim);}

/* ---------- Sources / footer ---------- */
.sources{
  background:var(--navy-deep);
  color:rgba(255,255,255,.65);
  border-radius:16px;
  padding:18px;
  font-size:12px;
  line-height:1.7;
}
.sources a{color:var(--gold-light);}
.sources h4{color:var(--white); font-size:13px; margin-bottom:8px;}
.disclaimer{
  background:rgba(11,41,66,.06);
  border-radius:14px;
  padding:14px;
  font-size:11.5px;
  color:#6b7883;
  line-height:1.6;
  margin-top:14px;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--navy); color:var(--white);
  padding:12px 20px; border-radius:99px;
  font-size:13px; font-weight:700;
  box-shadow:0 10px 24px rgba(0,0,0,.3);
  z-index:200; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
}
.toast.show{opacity:1; transform:translate(-50%,-6px);}

/* ---------- Print ---------- */
@media print{
  body{background:#fff !important;}
  #app{box-shadow:none; max-width:none;}
  .ruta-wrap, .screen-footer, .no-print{display:none !important;}
  .doc-page{box-shadow:none; border:1px solid #ccc; page-break-after:always;}
  .screen{padding:0;}
}

@media (max-width:360px){
  .cover h1{font-size:24px;}
  .game-opt{font-size:12px;}
}

</style>
</head>
<body>
<div id="app">

// ---------- UTILIDADES ----------
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

function todayStr() {
  const d = new Date();
  return d.toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });
}
function timeStr() {
  const d = new Date();
  return d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}
function generarCodigo() {
  const n = Math.floor(1000 + (Date.now() % 8999));
  return `RMS-2026-${String(n).padStart(4, '0')}`;
}
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- RUTA (progreso) ----------
function renderRuta() {
  const wrap = $('#ruta-wrap');
  if (state.screen === 'cover') { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  const activeIdx = SCREEN_TO_STEP[state.screen] ?? 0;
  const pct = (activeIdx / (ROUTE_STEPS.length - 1)) * 100;
  $('#ruta-line-fill').style.width = pct + '%';
  $('#ruta-truck').style.left = pct + '%';
  const nodesWrap = $('#ruta-nodes');
  nodesWrap.innerHTML = '';
  ROUTE_STEPS.forEach((label, i) => {
    const node = el(`<div class="ruta-node ${i < activeIdx ? 'done' : ''} ${i === activeIdx ? 'active' : ''}" title="${label}">${i < activeIdx ? '✓' : i + 1}</div>`);
    nodesWrap.appendChild(node);
  });
}

// ---------- NAVEGACIÓN ----------
function goTo(screen) {
  state.screen = screen;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- RENDER PRINCIPAL ----------
function render() {
  renderRuta();
  const main = $('#screen-root');
  main.innerHTML = '';
  const renderers = {
    cover: renderCover,
    registro: renderRegistro,
    aprende: renderAprende,
    detecta: renderDetecta,
    juego: renderJuego,
    evalua: renderEvalua,
    resultado: renderResultado,
    documento: renderDocumento
  };
  (renderers[state.screen] || renderCover)(main);
}

// ---------- REGISTRO PARTICIPANTE ----------
function renderRegistro(root) {
  root.appendChild(el(`
    <div class="screen">
      <div class="eyebrow">Paso 1</div>
      <h2>Regístrate para comenzar</h2>
      <p class="screen-sub">Solo necesitamos estos datos para tu constancia y registro de asistencia.</p>
      <div class="card">
        <div class="field">
          <label for="f-nombre">Nombre completo</label>
          <input type="text" id="f-nombre" placeholder="Ej: Juan Pérez Rodríguez" value="${state.participant.nombre}">
        </div>
        <div class="field">
          <label for="f-id">Número de identificación</label>
          <input type="text" inputmode="numeric" id="f-id" placeholder="Ej: 1082456789" value="${state.participant.identificacion}">
        </div>
        <div class="field">
          <label for="f-cargo">Cargo</label>
          <input type="text" id="f-cargo" placeholder="Ej: Conductor" value="${state.participant.cargo}">
        </div>
        <div class="field">
          <label for="f-area">Área</label>
          <input type="text" id="f-area" placeholder="Ej: Operaciones" value="${state.participant.area}">
          <div class="hint">Fecha del registro: ${todayStr()}</div>
        </div>
      </div>
      <div class="screen-footer">
        <button class="btn btn-primary" id="btn-reg-continuar">Continuar →</button>
      </div>
    </div>
  `));
  $('#btn-reg-continuar').addEventListener('click', () => {
    const nombre = $('#f-nombre').value.trim();
    const identificacion = $('#f-id').value.trim();
    const cargo = $('#f-cargo').value.trim();
    const area = $('#f-area').value.trim();
    if (!nombre || !identificacion || !cargo || !area) {
      showToast('Completa todos los campos para continuar');
      return;
    }
    state.participant = { ...state.participant, nombre, identificacion, cargo, area, fecha: todayStr(), horaInicio: timeStr() };
    goTo('aprende');
  });
}

// ---------- MÓDULO APRENDE ----------
function renderAprende(root) {
  const card = LEARN_CARDS[state.learnIndex];
  let inner = `<div class="icon">${card.icon}</div><h3>${card.title}</h3><p>${card.body}</p>`;
  if (card.grid) {
    inner += `<div class="grid-icons">${card.grid.map(g => {
      const [emoji, ...rest] = g.split(' ');
      return `<div class="g-item"><span>${emoji}</span>${rest.join(' ')}</div>`;
    }).join('')}</div>`;
  }
  if (card.flow) {
    inner += `<div class="flow">${card.flow.map((f, i) => `<span class="flow-step">${f}</span>${i < card.flow.length - 1 ? '<span class="flow-arrow">→</span>' : ''}`).join('')}</div>`;
  }
  if (card.dontList) {
    inner += `<ul class="dont-list">${card.dontList.map(d => `<li>${d}</li>`).join('')}</ul>`;
  }
  root.appendChild(el(`
    <div class="screen">
      <div class="eyebrow">Paso 2 · Capacitación rápida</div>
      <h2>Lo que debes saber</h2>
      <div class="learn-stage">
        <div class="learn-card">${inner}</div>
      </div>
      <div class="learn-dots">${LEARN_CARDS.map((_, i) => `<span class="${i === state.learnIndex ? 'active' : ''}"></span>`).join('')}</div>
      <div class="screen-footer">
        <div class="btn-row">
          ${state.learnIndex > 0 ? `<button class="btn btn-outline" id="btn-learn-prev">← Atrás</button>` : ''}
          <button class="btn btn-primary" id="btn-learn-next">${state.learnIndex === LEARN_CARDS.length - 1 ? 'Ir a "Detecta la alerta" →' : 'Siguiente →'}</button>
        </div>
      </div>
    </div>
  `));
  if (state.learnIndex > 0) $('#btn-learn-prev').addEventListener('click', () => { state.learnIndex--; render(); });
  $('#btn-learn-next').addEventListener('click', () => {
    if (state.learnIndex < LEARN_CARDS.length - 1) { state.learnIndex++; render(); }
    else goTo('detecta');
  });
}

// ---------- DETECTA LA ALERTA ----------
function renderDetecta(root) {
  const c = CASES[state.caseIndex];
  const correctCount = state.caseAnswers.filter(a => a.correct).length;
  root.appendChild(el(`
    <div class="screen">
      <div class="eyebrow">Paso 3 · Detecta la alerta</div>
      <h2>🚨 ¿Qué harías tú?</h2>
      <div class="case-counter">
        <span class="tag">Caso ${state.caseIndex + 1} / ${CASES.length}</span>
        <span class="score-badge">✔ ${correctCount}</span>
      </div>
      <div class="case-card">
        <div class="situation">"${c.situation}"</div>
        <div class="case-options" id="case-options">
          ${c.options.map((o, i) => `<button class="opt-btn" data-i="${i}"><span>${o.emoji}</span><span>${o.label}</span></button>`).join('')}
        </div>
        <div id="case-feedback"></div>
      </div>
      <div class="screen-footer">
        <button class="btn btn-primary hidden" id="btn-case-next">${state.caseIndex === CASES.length - 1 ? 'Ir al minijuego →' : 'Siguiente caso →'}</button>
      </div>
    </div>
  `));
  $$('#case-options .opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const i = parseInt(btn.dataset.i, 10);
      const isCorrect = i === c.correct;
      $$('#case-options .opt-btn').forEach((b, bi) => {
        b.disabled = true;
        if (bi === c.correct) b.classList.add('correct');
        else if (bi === i) b.classList.add('incorrect');
        else b.classList.add('dim');
      });
      const fb = $('#case-feedback');
      fb.appendChild(el(`
        <div class="feedback-box ${isCorrect ? 'ok' : 'bad'}">
          <div class="fb-title">${isCorrect ? '✅ Correcto' : '❌ Revisa nuevamente'}</div>
          <div>${c.feedback}</div>
        </div>
      `));
      state.caseAnswers[state.caseIndex] = { correct: isCorrect };
      $('#btn-case-next').classList.remove('hidden');
    });
  });
  $('#btn-case-next').addEventListener('click', () => {
    if (state.caseIndex < CASES.length - 1) { state.caseIndex++; render(); }
    else goTo('juego');
  });
}

// ---------- MINIJUEGO ----------
function renderJuego(root) {
  if (state.gameIndex >= GAME_ITEMS.length) {
    const correct = state.gameAnswers.filter(a => a.correct).length;
    root.appendChild(el(`
      <div class="screen">
        <div class="eyebrow">Paso 4 · Minijuego</div>
        <h2>🎮 Normal, alerta o informar</h2>
        <div class="result-hero ${correct >= 4 ? 'pass' : 'fail'}">
          <div class="score-num">${correct}/${GAME_ITEMS.length}</div>
          <div class="score-pct">Resultado del minijuego</div>
          <div class="status">${correct >= 4 ? '¡MUY BIEN!' : 'SIGUE PRACTICANDO'}</div>
        </div>
        <div class="card">
          <p style="font-size:14.5px; color:#3d4a56;">${correct >= 4
            ? '¡Muy bien! Reconoces adecuadamente las principales señales de alerta.'
            : 'Vas por buen camino. Repasa los casos y sigue afinando tu criterio para identificar alertas.'}</p>
        </div>
        <div class="screen-footer">
          <button class="btn btn-primary" id="btn-game-continuar">Ir a la evaluación final →</button>
        </div>
      </div>
    `));
    $('#btn-game-continuar').addEventListener('click', () => goTo('evalua'));
    return;
  }
  const item = GAME_ITEMS[state.gameIndex];
  root.appendChild(el(`
    <div class="screen">
      <div class="eyebrow">Paso 4 · Minijuego</div>
      <h2>🎮 Normal, alerta o informar</h2>
      <div class="case-counter">
        <span class="tag">Situación ${state.gameIndex + 1} / ${GAME_ITEMS.length}</span>
        <span class="score-badge">✔ ${state.gameAnswers.filter(a => a.correct).length}</span>
      </div>
      <div class="game-card">
        <div class="situation">"${item.situation}"</div>
        <div class="game-options" id="game-options">
          <button class="game-opt normal" data-t="normal"><span class="emoji">🟢</span>NORMAL</button>
          <button class="game-opt alerta" data-t="alerta"><span class="emoji">🟡</span>ALERTA</button>
          <button class="game-opt informar" data-t="informar"><span class="emoji">🔴</span>INFORMAR</button>
        </div>
        <div id="game-feedback"></div>
      </div>
      <div class="screen-footer">
        <button class="btn btn-primary hidden" id="btn-game-next">Siguiente →</button>
      </div>
    </div>
  `));
  $$('#game-options .game-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const t = btn.dataset.t;
      const isCorrect = t === item.correct;
      $$('#game-options .game-opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.t === item.correct) b.classList.add('chosen-correct');
        else if (b.dataset.t === t) b.classList.add('chosen-wrong');
      });
      $('#game-feedback').appendChild(el(`
        <div class="feedback-box ${isCorrect ? 'ok' : 'bad'}">
          <div class="fb-title">${isCorrect ? '✅ Correcto' : '❌ No era esa'}</div>
          <div>${item.feedback}</div>
        </div>
      `));
      state.gameAnswers[state.gameIndex] = { correct: isCorrect, chosen: t };
      $('#btn-game-next').classList.remove('hidden');
    });
  });
  $('#btn-game-next').addEventListener('click', () => { state.gameIndex++; render(); });
}

// ---------- EVALUACIÓN FINAL ----------
function renderEvalua(root) {
  const i = state.quizIndex;
  const q = QUIZ[i];
  const selected = state.quizAnswers[i];
  root.appendChild(el(`
    <div class="screen">
      <div class="eyebrow">Paso 5 · Evaluación final</div>
      <h2>Pregunta ${i + 1} de ${QUIZ.length}</h2>
      <div class="quiz-q">
        <h3>${q.q}</h3>
        <div id="quiz-options">
          ${q.options.map((op, oi) => `
            <div class="quiz-opt ${selected === oi ? 'selected' : ''}" data-i="${oi}">
              <span class="letter">${String.fromCharCode(65 + oi)}</span>
              <span>${op}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="screen-footer">
        <div class="btn-row">
          ${i > 0 ? `<button class="btn btn-outline" id="btn-quiz-prev">← Atrás</button>` : ''}
          <button class="btn btn-primary" id="btn-quiz-next" ${selected == null ? 'disabled' : ''}>${i === QUIZ.length - 1 ? 'Ver resultado →' : 'Siguiente →'}</button>
        </div>
      </div>
    </div>
  `));
  $$('#quiz-options .quiz-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      state.quizAnswers[i] = parseInt(opt.dataset.i, 10);
      render();
    });
  });
  if (i > 0) $('#btn-quiz-prev').addEventListener('click', () => { state.quizIndex--; render(); });
  $('#btn-quiz-next').addEventListener('click', () => {
    if (state.quizAnswers[i] == null) return;
    if (i < QUIZ.length - 1) { state.quizIndex++; render(); }
    else {
      state.participant.horaFin = timeStr();
      if (!state.code) state.code = generarCodigo();
      persistToSheet();
      goTo('resultado');
    }
  });
}

function computeScore() {
  let correct = 0;
  QUIZ.forEach((q, i) => { if (state.quizAnswers[i] === q.correct) correct++; });
  const pct = Math.round((correct / QUIZ.length) * 100);
  return { correct, total: QUIZ.length, pct, pass: pct >= 80 };
}

// ---------- RESULTADO ----------
function renderResultado(root) {
  const s = computeScore();
  root.appendChild(el(`
    <div class="screen">
      <div class="eyebrow">Resultado</div>
      <h2>🎉 ¡Capacitación finalizada!</h2>
      <div class="result-hero ${s.pass ? 'pass' : 'fail'}">
        <div class="score-num">${s.correct}/${s.total}</div>
        <div class="score-pct">${s.pct}% de respuestas correctas</div>
        <div class="status">${s.pass ? '✅ APROBADO' : '⚠️ REQUIERE REFUERZO'}</div>
      </div>
      <div class="card">
        <div class="doc-row"><span>Participante</span><span>${state.participant.nombre}</span></div>
        <div class="doc-row"><span>Cargo</span><span>${state.participant.cargo}</span></div>
        <div class="doc-row"><span>Código</span><span class="doc-code">${state.code}</span></div>
      </div>
      ${!s.pass ? `<div class="disclaimer" style="margin-top:14px;">Obtuviste menos del 80%. Puedes repasar el material y repetir la evaluación cuantas veces lo necesites.</div>` : ''}
      <div class="screen-footer">
        <div class="btn-row">
          ${!s.pass ? `<button class="btn btn-outline" id="btn-repetir">🔁 Repetir evaluación</button>` : ''}
          <button class="btn btn-primary" id="btn-generar-doc">📄 Generar constancia</button>
        </div>
      </div>
    </div>
  `));
  if (!s.pass) {
    $('#btn-repetir').addEventListener('click', () => {
      state.attempt++;
      state.quizIndex = 0;
      state.quizAnswers = new Array(QUIZ.length).fill(null);
      goTo('evalua');
    });
  }
  $('#btn-generar-doc').addEventListener('click', () => goTo('documento'));
}

  $('#btn-volver').addEventListener('click', () => goTo('resultado'));

    showToast('¡Gracias! Puedes cerrar esta ventana.');
  });

function getRecomendacion(s) {
  if (s.pct === 100) {
    return "El participante demuestra un buen nivel de comprensión de los conceptos básicos del RMS. Se recomienda mantener la atención frente a situaciones inusuales y utilizar siempre los canales internos establecidos para informar cualquier alerta.";
  } else if (s.pct >= 80) {
    return "El participante aprobó la evaluación, pero se recomienda reforzar algunos conceptos relacionados con la identificación y reporte de señales de alerta.";
  }
  return "Se recomienda realizar un refuerzo de la capacitación, especialmente en la identificación de señales de alerta y el procedimiento interno para informar situaciones inusuales.";
}

// ---------- GOOGLE SHEETS ----------
function persistToSheet() {
  if (!CONFIG.GOOGLE_SHEETS_WEBAPP_URL) return; // no configurado: se omite en silencio
  const s = computeScore();
  const record = {
    codigo: state.code,
    nombre: state.participant.nombre,
    identificacion: state.participant.identificacion,
    cargo: state.participant.cargo,
    area: state.participant.area,
    fecha: state.participant.fecha,
    hora: state.participant.horaFin || state.participant.horaInicio,
    resultado: `${s.correct}/${s.total}`,
    porcentaje: s.pct,
    respuestas: QUIZ.map((q, i) => q.options[state.quizAnswers[i]]),
    recomendaciones: getRecomendacion(s),
    estado: s.pass ? 'APROBADO' : 'REQUIERE REFUERZO'
  };
  try {
    fetch(CONFIG.GOOGLE_SHEETS_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record)
    }).catch(() => {});
  } catch (e) { /* silencioso: la constancia funciona igual sin conexión a Sheets */ }
}
